name: smoke-test
on:
  workflow_dispatch:
  push:
    paths: ['code/**', '.github/workflows/smoke.yml']
permissions:
  contents: write
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with: { lfs: false }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install numpy==2.2.* scipy numba
      - name: Machine info
        run: nproc; free -m; python -c "import numpy,scipy,numba;print(numpy.__version__,scipy.__version__,numba.__version__)"
      - name: Code check on the 216k test glass (new vs old code must agree)
        working-directory: code
        run: python -u test_4g.py | tee ../smoke_test.log
      - name: Speed and memory check at 13.8M nodes
        working-directory: code
        run: python -u bench_runner.py | tee ../bench.log
      - name: Save logs into the repository
        if: always()
        run: |
          mkdir -p results/smoke && cp *.log results/smoke/ || true
          (nproc; free -m) > results/smoke/machine.txt
          git config user.name github-actions; git config user.email 41898283+github-actions[bot]@users.noreply.github.com
          git add results/smoke && git commit -m "smoke-test logs [skip ci]" && git pull --rebase && git push || echo nothing to push
