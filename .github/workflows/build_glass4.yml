name: build_glass4
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install numpy==2.2.* scipy numba
      - name: Build glass s4 and measure c
        working-directory: code
        run: |
          mkdir -p ../results/glass4
          python -u build_glass4.py 2>&1 | tee ../results/glass4/build.log
      - name: Save network into the repository
        if: always()
        run: |
          git config user.name github-actions; git config user.email 41898283+github-actions[bot]@users.noreply.github.com
          git add networks/glass_n1728000_s4_* results/glass4
          git commit -m "Replication glass s4 and its measured c [skip ci]" || exit 0
          for i in 1 2 3 4 5; do git pull --rebase -q && git push -q && exit 0; sleep 15; done
          exit 1
